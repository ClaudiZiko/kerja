<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Question ❤️</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe4e1;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Biar nggak ada scroll */
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            text-align: center;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            position: absolute;
        }
        .yes-btn {
            background-color: #ff69b4;
            color: white;
            position: static; /* Biar nggak gerak-gerak */
        }
        .no-btn {
            background-color: #d3d3d3;
            left: 50%;
            transform: translateX(-50%);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="step1">
        <h2>Hey, I have a question for you!</h2>
        <h3>Do you have a boyfriend?</h3>
        <button class="yes-btn" onclick="hasBoyfriend()">Yes</button>
        <button class="no-btn" onclick="nextQuestion()">No</button>
    </div>

    <div class="container hidden" id="step2">
        <h2>Great! I have another question! ❤️</h2>
        <h3>Will you be my girlfriend?</h3>
        <button class="yes-btn" onclick="yesAnswer()">Yes</button>
        <button class="no-btn" id="noButton">No</button>
    </div>

    <script>
        function hasBoyfriend() {
            alert("Oh... That's okay! I just wanted to ask. 😊");
        }

        function nextQuestion() {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
        }

        function yesAnswer() {
            alert("Yay! I love you! ❤️ now you are mine 🫵");
            window.location.replace('home.html');
        }

        function moveButton() {
            let noButton = document.getElementById("noButton");

            let maxX = window.innerWidth - noButton.offsetWidth - 20; // Biar nggak keluar layar
            let maxY = window.innerHeight - noButton.offsetHeight - 20;

            let x = Math.random() * maxX;
            let y = Math.random() * maxY;

            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }

        document.addEventListener("DOMContentLoaded", function () {
            let noButton = document.getElementById("noButton");
            noButton.addEventListener("mouseover", moveButton);
            noButton.addEventListener("click", moveButton);
        });
    </script>
</body>
</html>
