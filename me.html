<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Question ❤️</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
            background-color: #ffe4e1;
            overflow: hidden; /* Mencegah scroll karena tombol kabur */
            height: 100vh; /* Pastikan seluruh konten dalam satu layar */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .yes-btn {
            background-color: #ff69b4;
            color: white;
        }
        .no-btn {
            background-color: #d3d3d3;
            position: absolute;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="step1">
        <h2>Hey, I have a question for you!</h2>
        <h3>Do you have a boyfriend?</h3>
        <button class="yes-btn" onclick="hasBoyfriend()">Yes</button>
        <button class="no-btn" onclick="nextQuestion()">No</button>
    </div>

    <div class="container hidden" id="step2">
        <h2>Great! I have another question! ❤️</h2>
        <h3>Will you be my girlfriend?</h3>
        <button class="yes-btn" onclick="yesAnswer()">Yes</button>
        <button class="no-btn" id="noButton">No</button>
    </div>

    <script>
        function hasBoyfriend() {
            alert("Oh... That's okay! I just wanted to ask. 😊");
        }

        function nextQuestion() {
            document.getElementById("step1").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");

            let noButton = document.getElementById("noButton");
            noButton.style.position = "absolute";
            noButton.style.left = "50%";
            noButton.style.top = "60%";

            noButton.addEventListener("mouseover", moveButton);
            noButton.addEventListener("mousedown", moveButton);
        }

        function yesAnswer() {
            alert("Yay! I love you! ❤️ now you are mine 🫵");
            window.location.replace('home.html');
        }

        function moveButton() {
            let noButton = document.getElementById("noButton");

            let maxX = window.innerWidth - noButton.offsetWidth - 20;
            let maxY = window.innerHeight - noButton.offsetHeight - 20;

            let x = Math.random() * maxX;
            let y = Math.random() * maxY;

            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }
    </script>
</body>
</html>
